name: LEOXIS preflight
on:
  push:
    branches: [staging, main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural regression checks
        run: python scripts/leoxis_preflight.py
      - name: JavaScript syntax checks
        run: |
          for f in .leoxis_jscheck/*.js; do node --check "$f"; done
